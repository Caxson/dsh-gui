# Build the unsigned macOS app on a GitHub runner and attach the artifacts to
# a Release — publishing never depends on the maintainer's local uplink.
#
# Trigger: push a tag like v1.2.0, or run manually with a tag input.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0); must already exist or will be created at this ref'
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify engine dependency closure
        # No release ships on an incoherent runtime family — fail before build.
        run: npm run verify:closure

      - name: Install dependencies
        run: npm ci

      - name: Bundle Chromium for the browser plugin
        run: PLAYWRIGHT_BROWSERS_PATH=resources/browsers npx playwright install chromium

      - name: Build dmg + zip (unsigned)
        run: CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac -c.mac.notarize=false --publish never

      - name: Upload artifacts to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dsh GUI $TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml
