<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="panel.css" />
  <title>Dsh GUI Panel</title>
</head>
<body>
  <header class="panel-header">
    <nav id="tabstrip" class="tabstrip" role="tablist"></nav>
    <button id="new-tab-btn" class="icon-btn" title="新建标签页" aria-label="新建标签页">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 3.2v9.6M3.2 8h9.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="header-spacer"></div>
    <button id="theme-btn" class="icon-btn" title="主题" aria-label="切换主题">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="5.3" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 2.7v10.6" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 2.7a5.3 5.3 0 0 1 0 10.6z" fill="currentColor"/>
      </svg>
    </button>
    <button id="popout-btn" class="icon-btn" title="在独立窗口中打开" aria-label="弹出面板">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6.5 3.5H3.5v9h9V9.5M9.5 3.5h3v3M12.5 3.5 8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="collapse-btn" class="icon-btn" title="收起面板 (Cmd+B)" aria-label="收起面板">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2.2" y="3" width="11.6" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <path d="M9.8 3v10" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
  </header>

  <div id="newtab-menu" class="menu" hidden>
    <button class="menu-item" data-type="terminal">
      <span class="menu-icon">❯_</span>终端<span class="menu-kbd">⌘T</span>
    </button>
    <button class="menu-item" data-type="web">
      <span class="menu-icon">◐</span>浏览器
    </button>
    <button class="menu-item" data-type="tree">
      <span class="menu-icon">⌸</span>文件树<span class="menu-kbd">⌘E</span>
    </button>
    <button class="menu-item" data-type="files">
      <span class="menu-icon">±</span>改动<span class="menu-kbd">⌘P</span>
    </button>
    <button class="menu-item" data-type="sidechat">
      <span class="menu-icon">💬</span>侧边聊天<span class="menu-kbd">⌥⌘S</span>
    </button>
  </div>

  <main id="panes" class="panes"></main>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="diff.js"></script>
  <script src="panes.js"></script>
  <script src="panel.js"></script>
</body>
</html>
