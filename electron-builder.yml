appId: io.github.caxson.dsh-gui
productName: Dsh GUI
copyright: "© 2026 Caxson"

directories:
  buildResources: build
  output: dist

files:
  - src/**/*
  - plugins/**/*
  - assets/**/*
  - package.json
  - node_modules/**/*
  # Ship only what runs. Source maps alone are 61MB and nothing loads them in
  # production; type declarations, package docs and test fixtures are likewise
  # dead weight in an installer. Deliberately NOT excluding plain .ts sources —
  # the engine can load TypeScript at runtime (dsh-typert-*), so dropping those
  # would trade size for a broken feature. LICENSE files stay, for compliance.
  - '!**/*.{map,d.ts,d.mts,d.cts,tsbuildinfo}'
  - '!**/{README,readme,CHANGELOG,changelog,HISTORY}*'
  - '!**/{test,tests,__tests__,spec,example,examples,docs,doc}/**'
  - '!**/{.github,.vscode,.idea}/**'

# Chromium for the browser pane is NOT bundled: it is ~355MB, roughly 40% of
# the installed app, and most people never open that tab. It is downloaded on
# first use into the user data directory instead (src/chromium.js), where it
# also survives updates rather than being re-shipped with every release.

# DSH's loader resolves plugin packages through Node's internal ESM loader,
# which cannot read inside the asar archive (the DSH home's node_modules are
# symlinks into the app bundle). Ship the app unpacked so every require/import
# hits real files — same layout as the dev run.
asar: false

# Rely on the shipped N-API prebuilds; do not rebuild against Electron headers.
npmRebuild: false

# The app is Chinese/English only; Electron otherwise ships ~50 locale bundles
# totalling 47MB.
electronLanguages:
  - en-US
  - zh-CN

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Signed + notarized distribution. Locally, electron-builder picks up the
  # "Developer ID Application" certificate from the login keychain; in CI, the
  # release workflow feeds it CSC_LINK (base64 p12) + APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from repo secrets. Without a
  # certificate the build degrades to unsigned (`npm run dist:unsigned`).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # Architecture comes from the CLI (`--arm64` / `--x64`). The app bundles a
  # Chromium build for the browser pane and Chromium is architecture-specific,
  # so each arch is built on a runner of that architecture and the resulting
  # feeds are merged (scripts/merge-mac-feed.mjs).
  target:
    - target: dmg
    # The zip + latest-mac.yml are what the app's built-in auto-updater uses.
    - target: zip

win:
  # electron-builder renders the .ico from this PNG.
  icon: assets/icon-1024.png
  target:
    # nsis is the installer people expect; the portable build is for machines
    # where installing is not an option (locked-down or shared).
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Keeping the shortcut name in sync with the product avoids two entries in
  # the Start menu after a rename.
  shortcutName: Dsh GUI

# Self-update feed: GitHub Releases is the canonical channel (electron-builder
# embeds it into app-update.yml and generates latest-mac.yml next to the zip).
# Mainland-China users can point DSH_GUI_UPDATE_URL at the OSS mirror instead.
publish:
  provider: github
  owner: Caxson
  repo: dsh-gui

dmg:
  title: "${productName} ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

artifactName: "${productName}-${version}-${arch}.${ext}"
