# Gate for engine bumps (and every PR): boot the real engine + panel on a
# macOS runner and run the end-to-end smoke probe. A green run means the
# upstream update kept our plugin contracts intact.
name: smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify engine dependency closure
        # Reads only the committed lockfile — catches an incoherent engine bump
        # (a split runtime family, or a newly-added first-party package we never
        # picked up) before we spend time installing or booting anything.
        run: npm run verify:closure

      - name: Verify bilingual docs consistency
        # Committed-file only: README must keep both languages and stay in
        # step with package.json / electron-builder.yml / src/main.js.
        run: npm run verify:docs

      - name: Install dependencies
        run: npm ci

      - name: Verify the phone boundary
        # These drive the real relay over real sockets and ask the questions
        # that matter: can something that is not the paired phone reach the
        # engine, and can a room id alone drive or lock out a desktop. They were
        # written earlier and — until this step existed — had never once run in
        # CI, which is the same as not having them.
        run: npm run verify:mobile

      - name: Verify theme injection
        # Adversarial: a palette is data, and data from a downloaded theme file
        # must not be able to close a CSS rule and open its own.
        run: npm run verify:themes

      - name: Verify sidebar status logic
        # The path trim has to fit a fixed strip and trim from the front. Its
        # budget is in monospace columns, not characters: Chinese has no true
        # monospace face and takes two columns, so a character budget let a
        # Chinese path overflow to twice the strip — where CSS then cut the
        # tail, which is the half that identifies a path.
        run: npm run verify:shell

      - name: Run end-to-end smoke
        # The runner isolates the app's user data and DSH home itself, seeds a
        # workspace + session so the workspace-derived panes have something to
        # show, and fails unless every probe reported ok — engine boot, the
        # shared PTY chain, the browser tab loop, panel layout, and the
        # panel→composer backflow. Asserting lives in the runner rather than in
        # greps here, so a local run cannot pass on weaker terms than CI.
        run: npm run smoke

  # Separate job, and a newer image: the phone client is Swift 6, which needs a
  # toolchain the macos-14 image does not ship. Keeping it apart also means a
  # runner-image change here cannot disturb the Electron smoke above.
  phone-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show the Swift toolchain
        # Printed on purpose: if this check ever starts failing to compile, the
        # first question is which compiler ran.
        run: swift --version

      - name: Install dependencies
        # The relay needs `ws`; nothing else here does.
        run: npm ci

      - name: Verify the phone client against the desktop
        # The phone protocol is implemented twice, in two languages. Where the
        # two disagree — room derivation, reply shape, seconds vs milliseconds —
        # nothing errors: the phone lands in a room nobody else is in, or shows
        # a conversation dated 1970. This compiles the app's own Swift and runs
        # it against the real relay and the real desktop link.
        run: npm run verify:ios
