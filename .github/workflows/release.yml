# Build the macOS app for both architectures on GitHub runners and attach the
# artifacts to a Release — publishing never depends on the maintainer's local
# uplink.
#
# Electron itself is architecture-specific, so each arch is built on a runner of
# that architecture (macos-14 = Apple Silicon, macos-15-intel = Intel) and the
# two update feeds are merged into one that serves both.
#
# Trigger: push a tag like v1.2.0, or run manually with a tag input.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0); must already exist or will be created at this ref'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          # The last Intel image Actions offers (macos-13 was retired in
          # December 2025); x86_64 support ends with it in August 2027.
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify engine dependency closure + docs consistency
        # No release ships on an incoherent runtime family or a doc that has
        # drifted from the code — fail before build.
        run: |
          npm run verify:closure
          npm run verify:docs

      - name: Install dependencies
        run: npm ci

      - name: Build dmg + zip (signed + notarized when secrets present)
        # With CSC_LINK (base64 Developer ID p12) + Apple notarization secrets
        # set on the repo, electron-builder signs and notarizes; without them
        # the workflow degrades to an unsigned build. `--publish never` — the
        # publish job owns the upload.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Signing without notarization buys nothing on modern macOS —
          # Gatekeeper still blocks a downloaded app — and would fail the build
          # outright, since notarize is on. So take the signed path only when
          # the whole credential set is present, and say which way it went.
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "building signed + notarized ($ARCH)"
            # Notarization uploads a ~450MB archive to Apple, and that transfer
            # times out often enough to fail an otherwise good release. Retry
            # the build rather than leaving a tagged version unpublished; a
            # genuine signing or notarization rejection fails all three times.
            for attempt in 1 2 3; do
              if npx electron-builder --mac --$ARCH --publish never; then
                echo "build succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "notarized build failed three times — not a transient upload problem"
                exit 1
              fi
              echo "attempt $attempt failed; retrying in 60s"
              sleep 60
            done
          else
            echo "building UNSIGNED ($ARCH) — signing/notarization secrets incomplete"
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --$ARCH -c.mac.notarize=false --publish never
          fi

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p staged
          cp dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml staged/ 2>/dev/null || true
          ls -la staged

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: staged/
          retention-days: 3
          if-no-files-found: error

  # Windows is built separately rather than folded into the matrix above: it
  # shares none of the mac signing, notarization or feed-merging steps, and
  # keeping them apart means a Windows change cannot regress the mac release.
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify engine dependency closure + docs consistency
        run: |
          npm run verify:closure
          npm run verify:docs

      - name: Install dependencies
        run: npm ci

      - name: Build installer + portable
        # Unsigned: Windows code signing needs a separate certificate. SmartScreen
        # warns on first run until one is configured; the app still installs.
        run: npx electron-builder --win --x64 --publish never

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          cp dist/*.exe dist/*.blockmap dist/latest.yml staged/ 2>/dev/null || true
          ls -la staged
          # Both Windows targets emit .exe. If they ever share a filename again
          # the second build silently overwrites the first and the feed ends up
          # describing a file that is no longer there — catch it here, at the
          # step that produced it, rather than downstream.
          count=$(ls staged/*.exe 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -ne 2 ]; then
            echo "expected 2 Windows artifacts (installer + portable), found $count:"
            ls staged/*.exe 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: staged/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [build, build-win]
    runs-on: ubuntu-latest
    env:
      # `secrets` is not dependable inside a step-level `if`; surface the one
      # bit we need as a job-level env value instead.
      HAS_MIRROR: ${{ secrets.OSS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Merge per-arch update feeds
        # One feed listing both architectures; electron-updater picks the right
        # file by arch (and handles Rosetta) at update time.
        run: |
          set -euo pipefail
          mkdir -p out
          # Every artifact except the per-arch feeds, which are merged below
          # into a single out/latest-mac.yml rather than clobbering each other.
          for d in incoming/mac-*; do
            for f in "$d"/*; do
              [ "$(basename "$f")" = "latest-mac.yml" ] && continue
              cp "$f" out/
            done
          done
          node scripts/merge-mac-feed.mjs out/latest-mac.yml incoming/mac-*/latest-mac.yml
          # Windows updates through its own latest.yml — a separate channel, so
          # it is copied across untouched rather than merged into the mac feed.
          for d in incoming/win-*; do
            [ -d "$d" ] || continue
            cp "$d"/* out/
          done
          cat out/latest-mac.yml
          ls -la out

      # Before anything is published: does each feed describe the file that was
      # actually built? A filename collision between two targets shows up here,
      # while the release can still be stopped — and this runs even on forks,
      # where the mirror steps are skipped.
      - name: Verify the release is internally consistent
        run: node scripts/verify-downloads.mjs out

      - name: Upload artifacts to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          # GitHub's API returns 5xx often enough to lose a release here, and
          # failing at this step is the worst place to fail: the tag exists and
          # points at a version nobody can download. The build step already
          # retries its own flaky dependency (notarization); this one has the
          # same need. Both commands are idempotent — `release view` guards the
          # create, and `--clobber` makes re-uploading safe.
          publish() {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dsh GUI $TAG" --generate-notes
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber out/*
          }
          for attempt in 1 2 3 4 5; do
            if publish; then
              echo "published on attempt $attempt"
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "publishing failed five times — not a transient API problem"
              exit 1
            fi
            echo "attempt $attempt failed; retrying in 30s"
            sleep 30
          done

      # Ordered after the upload on purpose: the changelog is built from
      # the repository's release list, so building it first produced notes
      # that stopped one version short — the release being published did
      # not exist yet, and the version someone had just downloaded was the
      # one they could not read about.
      # Built from the artifacts actually being released, not from the update
      # feeds: the feeds list what the updater needs (mac .zip, installer only)
      # while the page lists what a person installs (.dmg, both .exe flavours).
      - name: Build the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes for our own changelog page. The download page links
          # there instead of to GitHub Releases, whose asset table shows the
          # file sizes the page deliberately never mentions. Best-effort: no
          # notes simply means an empty changelog, never a failed release.
          # The REST list carries the notes; `gh release list --json` does not
          # expose a body field, so it would have produced an empty changelog.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            > releases.json || echo '[]' > releases.json
          node scripts/build-site.mjs out dist-site/index.html releases.json

      # The mirror is the app's default update feed and backs the download page,
      # so it must never lag a Release. electron-builder writes dot-named files
      # while latest-mac.yml references dash-named URLs — upload under the
      # dashed name so the feed resolves.
      - name: Mirror artifacts and page to the CDN
        # Skipped silently when mirror credentials are absent (e.g. on forks).
        if: env.HAS_MIRROR == 'true'
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
          # ossutil v2 signs with SigV4, which requires an explicit region —
          # there is no ~/.ossutilconfig on a runner to infer it from.
          OSS_REGION: cn-hangzhou
          # Artifacts live under a prefix of the shared static bucket; the
          # download page has its own bucket, whose root is the site served at
          # the public domain. They are deliberately not the same bucket — the
          # shared one's root is another site entirely.
          OSS_BUCKET: merefusion-static
          OSS_PREFIX: dsh-gui
          OSS_SITE_BUCKET: dsh-gui-site
        run: |
          set -euo pipefail
          curl -fsSL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.1/ossutil-2.1.1-linux-amd64.zip
          unzip -q -j ossutil.zip -d ossutil-bin
          chmod +x ossutil-bin/ossutil
          put() {
            ossutil-bin/ossutil cp -f "$1" "$2" \
              --cache-control "$3" \
              --endpoint "$OSS_ENDPOINT" \
              --region "$OSS_REGION" \
              --access-key-id "$OSS_KEY_ID" \
              --access-key-secret "$OSS_KEY_SECRET"
          }
          # Release artifacts + update feed. electron-builder names files after
          # the product ("Dsh GUI-1.3.0-arm64.dmg") but writes dashed URLs into
          # latest-mac.yml, so upload under the dashed name or the feed and the
          # download page both point at objects that do not exist.
          #
          # Caching splits by role. A versioned artifact never changes once
          # published, so it can be cached hard. The feeds are the opposite:
          # they are the pointer to the newest version, and a cached copy is a
          # release nobody can see — both the updater and the download page
          # would keep reporting the previous version until the cache expired.
          for f in out/*; do
            base=$(basename "$f")
            case "$base" in
              latest*.yml) cache='no-cache' ;;
              *)           cache='public, max-age=31536000, immutable' ;;
            esac
            put "$f" "oss://$OSS_BUCKET/$OSS_PREFIX/$(echo "$base" | tr ' ' '-')" "$cache"
          done
          # Download page (page + its assets) at the site bucket's root. Also
          # no-cache: the page carries the baked version, so a stale copy is a
          # download page advertising an old release.
          ossutil-bin/ossutil cp -f -r dist-site/ "oss://$OSS_SITE_BUCKET/" \
            --cache-control "no-cache" \
            --endpoint "$OSS_ENDPOINT" \
            --region "$OSS_REGION" \
            --access-key-id "$OSS_KEY_ID" \
            --access-key-secret "$OSS_KEY_SECRET"

      # Uploading is not the same as being downloadable. Every artifact — the
      # ones the feeds advertise and the ones only the download page offers —
      # must come back from the mirror at the size it left here.
      - name: Verify every published artifact is downloadable
        if: env.HAS_MIRROR == 'true'
        run: |
          node scripts/verify-downloads.mjs out \
            https://merefusion-static.oss-cn-hangzhou.aliyuncs.com/dsh-gui
