<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self';"
    />
    <title>手机连接</title>
    <style>
      :root {
        --bg: #151517;
        --bg-2: #1b1b1c;
        --bg-3: #2c2c2e;
        --bg-hover: #353638;
        --border: rgba(255, 255, 255, 0.07);
        --border-strong: rgba(255, 255, 255, 0.13);
        --text: #ebeef2;
        --text-mid: #adb2b8;
        --text-dim: #81858c;
        --accent: #4176e6;
        --green: #3fb950;
        --red: #f85149;
        --yellow: #d29922;
        --mono: "SF Mono", ui-monospace, Menlo, monospace;
        --radius: 8px;
        --radius-sm: 5px;
        --border-width: 1px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
        font-size: 13px;
        padding: 18px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        -webkit-font-smoothing: antialiased;
      }
      h1 { font-size: 15px; font-weight: 600; }
      .sub { color: var(--text-dim); font-size: 12px; line-height: 1.55; }
      .card {
        background: var(--bg-2);
        border: var(--border-width) solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row { display: flex; align-items: center; gap: 10px; }
      .row + .row { margin-top: 2px; }
      .grow { flex: 1; min-width: 0; }
      button {
        font: inherit;
        color: var(--text);
        background: var(--bg-3);
        border: var(--border-width) solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 6px 12px;
        cursor: pointer;
        /* Both matter in the relay row: without them the input's growth breaks
           a two-character label onto two lines. */
        flex: none;
        white-space: nowrap;
      }
      button:hover:not(:disabled) { background: var(--bg-hover); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--accent); border-color: transparent; color: #fff; }
      button.danger { color: var(--red); }
      input[type="text"] {
        font: inherit;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text);
        background: var(--bg);
        border: var(--border-width) solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 6px 8px;
        width: 100%;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex: none; }
      .dot.on { background: var(--green); }
      .dot.warn { background: var(--yellow); }
      .dot.off { background: var(--text-dim); }
      .state { font-size: 12px; color: var(--text-mid); }
      .qr-wrap { display: flex; gap: 14px; align-items: flex-start; }
      .qr {
        width: 168px; height: 168px; flex: none;
        background: #fff; border-radius: var(--radius-sm); padding: 8px;
      }
      .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
      .warn-text { color: var(--yellow); font-size: 12px; line-height: 1.5; }
      .mono { font-family: var(--mono); font-size: 11px; color: var(--text-dim); word-break: break-all; }
      .hidden { display: none; }
      .granted { list-style: none; display: flex; flex-direction: column; gap: 5px; }
      .granted li { color: var(--text-mid); font-size: 12px; }
      .granted li::before { content: "· "; color: var(--text-dim); }
      .granted li.no { color: var(--text-dim); }
      .granted li.no::before { content: "× "; color: var(--red); }
    </style>
  </head>
  <body>
    <div>
      <h1>手机连接</h1>
      <p class="sub">
        手机上可以看会话、翻历史、发消息。<strong>不能</strong>跑命令、开终端或读文件——
        这不是设置项，是网关里根本没有这些操作。
      </p>
    </div>

    <div class="card">
      <div class="row">
        <span class="dot off" id="dot"></span>
        <span class="state grow" id="state">未开启</span>
        <button id="toggle">开启</button>
      </div>
      <div class="row" id="relay-row">
        <span class="sub" style="flex: none">中转</span>
        <input type="text" id="relay" spellcheck="false" />
        <button id="relay-save">保存</button>
      </div>
      <p class="sub">
        中转只转发帧、不保存内容，也拿不到配对密钥——它按房间号配对，而房间号是密钥的单向摘要。
        想自己跑一个就改上面这行：仓库里的 <span class="mono">mobile/relay.mjs</span> 是完整实现。
      </p>
    </div>

    <div class="card hidden" id="pair-card">
      <div class="row">
        <span class="grow"><strong>配对</strong></span>
        <button id="reveal">显示二维码</button>
        <button id="rotate" class="danger">更换密钥</button>
      </div>
      <p class="warn-text hidden" id="rotate-warn">
        更换后，已配对的手机会立刻失效，需要重新扫码。
      </p>
      <div class="qr-wrap hidden" id="qr-wrap">
        <div class="qr"><img id="qr" alt="配对二维码" /></div>
        <div class="grow" style="display: flex; flex-direction: column; gap: 8px">
          <p class="warn-text">
            这张码里带着配对密钥本身。<strong>拿到它的人就能连上你的会话</strong>——
            别截图发出去，也别投屏。
          </p>
          <button id="copy">复制配对链接</button>
          <p class="mono" id="room"></p>
        </div>
      </div>
    </div>

    <div class="card">
      <strong style="font-size: 12px">手机能做什么</strong>
      <ul class="granted">
        <li>列出会话</li>
        <li>读一个会话的历史</li>
        <li>向会话发消息</li>
        <li class="no">执行工具、开终端、读写文件、新建或删除任何东西</li>
      </ul>
    </div>

    <script src="pairing.js"></script>
  </body>
</html>
