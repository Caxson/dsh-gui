# Gate for engine bumps (and every PR): boot the real engine + panel on a
# macOS runner and run the end-to-end smoke probe. A green run means the
# upstream update kept our plugin contracts intact.
name: smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify engine dependency closure
        # Reads only the committed lockfile — catches an incoherent engine bump
        # (a split runtime family, or a newly-added first-party package we never
        # picked up) before we spend time installing or booting anything.
        run: npm run verify:closure

      - name: Verify bilingual docs consistency
        # Committed-file only: README must keep both languages and stay in
        # step with package.json / electron-builder.yml / src/main.js.
        run: npm run verify:docs

      - name: Install dependencies
        run: npm ci

      - name: Run end-to-end smoke
        # The runner isolates the app's user data and DSH home itself, seeds a
        # workspace + session so the workspace-derived panes have something to
        # show, and fails unless every probe reported ok — engine boot, the
        # shared PTY chain, the browser tab loop, panel layout, and the
        # panel→composer backflow. Asserting lives in the runner rather than in
        # greps here, so a local run cannot pass on weaker terms than CI.
        run: npm run smoke
